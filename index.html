<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة عُمان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E3B3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column — hero, sticky day strip, a timeline whose nodes are the checkboxes, thumb-reach bar at the bottom */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --ink:#0D2A2E; --muted:#5B7275; --line:#D5E0DF; --line-strong:#B4C6C5;
  --accent:#0F766E; --accent-ink:#FFFFFF; --gold:#C27A1E; --gold-soft:rgba(194,122,30,.16); --late:#B4432F;
  --hero-1:#0B3438; --hero-2:#0F5F5A; --hero-fg:#F1FAF8; --hero-muted:rgba(241,250,248,.72);
  --cat-blue:#2B6CB0; --cat-plum:#7A4E9C; --cat-sand:#A8681A; --cat-green:#2F7D4F;
  --shadow:0 1px 2px rgba(13,42,46,.06),0 6px 18px -10px rgba(13,42,46,.25);
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081315; --surface:#102125; --ink:#E4F0EE; --muted:#8CA4A6; --line:#1E3539; --line-strong:#2E4B50;
  --accent:#2CC6B4; --accent-ink:#04201D; --gold:#EBA94C; --gold-soft:rgba(235,169,76,.18); --late:#F07A62;
  --hero-1:#0C2A2D; --hero-2:#0E4643; --hero-fg:#EEF8F6; --hero-muted:rgba(238,248,246,.7);
  --cat-blue:#7DB3F0; --cat-plum:#C3A0E4; --cat-sand:#E8B46A; --cat-green:#7FD1A0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081315; --surface:#102125; --ink:#E4F0EE; --muted:#8CA4A6; --line:#1E3539; --line-strong:#2E4B50;
  --accent:#2CC6B4; --accent-ink:#04201D; --gold:#EBA94C; --gold-soft:rgba(235,169,76,.18); --late:#F07A62;
  --hero-1:#0C2A2D; --hero-2:#0E4643; --hero-fg:#EEF8F6; --hero-muted:rgba(238,248,246,.7);
  --cat-blue:#7DB3F0; --cat-plum:#C3A0E4; --cat-sand:#E8B46A; --cat-green:#7FD1A0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;margin:0}
button{font:inherit;color:inherit}

/* Hero */
.hero{margin-top:14px;border-radius:24px;color:var(--hero-fg);background:linear-gradient(150deg,var(--hero-1),var(--hero-2));padding:20px 20px 18px;position:relative;overflow:hidden;isolation:isolate}
.hero svg.deco{position:absolute;inset:auto -10% -8px auto;width:120%;height:auto;z-index:-1;opacity:.55}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--hero-muted);display:flex;align-items:center;gap:8px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,36px);line-height:1.15;margin:6px 0 2px;text-wrap:balance}
.range{color:var(--hero-muted);font-size:14px;margin:0}
.hero-stats{display:flex;align-items:center;gap:14px;margin-top:18px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:scaleX(-1) rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.16)}
.ring .bar{stroke:var(--gold);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-stats .txt{min-width:0}
.hero-stats .big{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
.hero-stats .sub{margin:0;font-size:13px;color:var(--hero-muted)}
.chip-hero{margin-inline-start:auto;flex:none;font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);white-space:nowrap}

/* Day strip */
.strip-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;transition:background .2s,border-color .2s,transform .15s;min-width:0}
.day:active{transform:scale(.96)}
.day .dn{font-size:11px;color:var(--muted);white-space:nowrap}
.day .dd{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.day .pb{width:60%;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.day .pb i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .4s}
.day.today::after{content:"";position:absolute;top:6px;inset-inline-end:7px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.day[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-selected="true"] .dn{color:var(--accent-ink);opacity:.8}
.day[aria-selected="true"] .pb{background:color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.day[aria-selected="true"] .pb i{background:var(--accent-ink)}
.day.complete:not([aria-selected="true"]) .dd{color:var(--accent)}
.day:focus-visible,.seg button:focus-visible,.nav:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Day head */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 14px}
.dayhead h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;line-height:1.25;text-wrap:balance}
.dayhead .theme{margin:2px 0 0;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.dayhead .theme svg{width:14px;height:14px;flex:none}
.count{flex:none;font-size:13px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.count b{display:block;font-family:var(--f-display);color:var(--ink);font-size:18px}

/* Timeline */
.tl{list-style:none;margin:0;padding:0 0 8px}
.tl.anim-next{animation:inNext .35s cubic-bezier(.2,.8,.2,1)}
.tl.anim-prev{animation:inPrev .35s cubic-bezier(.2,.8,.2,1)}
@keyframes inNext{from{opacity:.2;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:.2;transform:translateX(24px)}to{opacity:1;transform:none}}
.item{position:relative;padding-bottom:12px;transition:opacity .3s,transform .3s}
.item::before{content:"";position:absolute;inset-inline-start:21px;top:42px;bottom:-10px;width:2px;border-radius:2px;background:var(--line);transition:background .35s}
.item:last-child::before{display:none}
.item.done::before{background:var(--accent)}
.item.leaving{opacity:0;transform:translateX(-16px)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;cursor:pointer}
.node{display:flex;justify-content:center;padding-top:12px}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;transition:background .2s,border-color .2s;position:relative;z-index:1}
.box svg{width:17px;height:17px;fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.box path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .05s}
.sr:checked + .box{background:var(--accent);border-color:var(--accent);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.sr:checked + .box path{stroke-dashoffset:0}
.sr:focus-visible + .box{outline:2px solid var(--gold);outline-offset:3px}
.item.next .box{border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-soft)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px 13px;box-shadow:var(--shadow);transition:opacity .3s,border-color .3s,box-shadow .3s;min-width:0}
.item.next .card{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),var(--shadow)}
.item.done .card{opacity:.6;box-shadow:none}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-family:var(--f-display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.dur{font-size:12px;color:var(--muted)}
.cat{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px 3px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.cat svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.badge.late{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.title{font-weight:600;font-size:16px;line-height:1.45;margin:6px 0 0;text-decoration:line-through 2px transparent;transition:text-decoration-color .3s}
.item.done .title{text-decoration-color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:13px;color:var(--muted)}
.meta span{display:flex;gap:6px;align-items:flex-start}
.meta svg{width:14px;height:14px;flex:none;margin-top:3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);color:var(--ink);font-size:18px;margin-bottom:4px}

.foot{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px 24px;color:var(--muted);font-size:12px}
.link{appearance:none;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.confirm button{border-radius:999px;padding:6px 14px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer}
.confirm .danger{background:var(--late);border-color:var(--late);color:#fff}

/* Bottom bar */
.spacer{height:calc(84px + env(safe-area-inset-bottom,0px))}
.bar{position:fixed;inset:auto 0 0;z-index:6;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav{appearance:none;flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;position:relative;min-width:0}
.seg button{appearance:none;border:0;background:none;border-radius:999px;height:36px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted);position:relative;z-index:1;transition:color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc(50% - 4px);border-radius:999px;background:var(--accent);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.seg.left .thumb{transform:translateX(-100%)}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:8;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;transition:opacity .3s,transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:600px){.hero{margin-top:24px;padding:26px 26px 22px}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="eyebrow"><span class="dot"></span>جدول رحلة المدير</div>
    <h1>رحلة عُمان</h1>
    <p class="range">من السبت 14 إلى الخميس 19 نوفمبر 2026 · مسقط وصلالة</p>
    <div class="hero-stats">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="27" fill="none" stroke-width="6"/><circle class="bar" id="ringBar" cx="32" cy="32" r="27" fill="none" stroke-width="6" stroke-linecap="round"/></svg>
        <b id="ringPct">0%</b>
      </div>
      <div class="txt">
        <p class="big" id="totalTxt">0 من 0 مهمة</p>
        <p class="sub">منجزة خلال الأسبوع</p>
      </div>
    </div>
  </header>

  <div class="strip-wrap">
    <div class="strip" id="strip" role="tablist" aria-label="أيام الرحلة"></div>
  </div>

  <main id="main">
    <div class="dayhead">
      <div style="min-width:0">
        <h2 id="dayTitle"></h2>
        <p class="theme" id="dayTheme"></p>
      </div>
      <div class="count"><b id="dayCount">0/0</b>منجزة</div>
    </div>
    <ol class="tl" id="tl"></ol>
  </main>

  <div class="spacer"></div>
</div>

<nav class="bar" aria-label="التنقل">
  <div class="bar-in">
    <button class="nav" id="prevBtn" type="button" aria-label="اليوم السابق"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="seg" id="seg">
      <span class="thumb"></span>
      <button type="button" id="fAll" aria-pressed="true">كل المهام</button>
      <button type="button" id="fLeft" aria-pressed="false">المتبقية</button>
    </div>
    <button class="nav" id="nextBtn" type="button" aria-label="اليوم التالي"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
const ICON = {
  travel:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  meeting:'<path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM22 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8"/>',
  visit:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  call:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  meal:'<path d="M3 8h14v5a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V8zM17 9h1.5a2.5 2.5 0 0 1 0 5H17M7 2v3M11 2v3"/>',
  hotel:'<path d="M2 18V6M2 14h20v4M22 14v-3a3 3 0 0 0-3-3h-8v6"/><circle cx="6.5" cy="10.5" r="1.5"/>',
  task:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5zM14 3v5h5M9 13h6M9 17h4"/>',
  personal:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  note:'<path d="M4 6h16M4 12h16M4 18h10"/>'
};
const CATS = {
  flight:{label:'طيران',c:'--cat-blue',i:'travel'}, gov:{label:'جهات حكومية',c:'--cat-plum',i:'task'},
  visit:{label:'زيارة مواقع',c:'--cat-green',i:'visit'}, workshop:{label:'ورشة عمل',c:'--cat-plum',i:'meeting'},
  meal:{label:'وجبة',c:'--cat-sand',i:'meal'}, rest:{label:'راحة',c:'--cat-blue',i:'hotel'},
  tour:{label:'جولة سياحية',c:'--cat-green',i:'personal'}
};
const DAYS = [
  {date:'2026-11-14',name:'السبت',short:'سبت',theme:'جدة ← مسقط',tasks:[
    ['12:05','','flight','ركوب الطائرة من جدة إلى مسقط'],
    ['16:00','','flight','الوصول إلى مسقط'],
    ['','','meal','عشاء مع الأستاذ سلطان'],
    ['','','workshop','ورشة عمل']
  ]},
  {date:'2026-11-15',name:'الأحد',short:'أحد',theme:'مسقط',tasks:[
    ['07:00','','meal','الفطور'],
    ['08:00','','gov','زيارة الدوائر الحكومية'],
    ['12:00','13:00','rest','راحة'],
    ['13:00','18:00','visit','زيارة المواقع']
  ]},
  {date:'2026-11-16',name:'الاثنين',short:'اثنين',theme:'مسقط ← صلالة',tasks:[
    ['05:00','','flight','التوجه إلى المطار، من مسقط إلى صلالة'],
    ['08:00','','flight','الوصول إلى صلالة'],
    ['09:00','12:00','gov','الدوائر الحكومية: وزارة الإسكان، الجوازات، وزارة التجارة'],
    ['13:00','18:00','visit','زيارة المواقع']
  ]},
  {date:'2026-11-17',name:'الثلاثاء',short:'ثلاثاء',theme:'صلالة',tasks:[
    ['07:00','','meal','الفطور'],
    ['08:00','12:00','gov','زيارة الدوائر الحكومية'],
    ['','','workshop','ورشة عمل للمواقع'],
    ['','','tour','جولة سياحية']
  ]},
  {date:'2026-11-18',name:'الأربعاء',short:'أربعاء',theme:'صلالة',tasks:[
    ['08:00','','gov','زيارة الدوائر الحكومية'],
    ['','','workshop','ورشة عمل']
  ]},
  {date:'2026-11-19',name:'الخميس',short:'خميس',theme:'العودة',tasks:[
    ['14:35','','flight','رحلة العودة']
  ]}
].map((d,di)=>({...d,tasks:d.tasks.map((t,ti)=>({id:`d${di+1}-${ti+1}`,time:t[0],end:t[1],cat:t[2],title:t[3]}))}));

const KEY='trip-oman-2026-v2';
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const todayISO=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
let sel=Math.max(0,DAYS.findIndex(d=>d.date===todayISO));
let filter='all';

const fmtTime=t=>{let[h,m]=t.split(':').map(Number);const s=h<12?'ص':'م';h=h%12||12;return `${h}:${pad(m)} ${s}`};
const daysWord=n=>n===1?'يوم واحد':n===2?'يومين':(n<=10?`${n} أيام`:`${n} يومًا`);
const total=()=>DAYS.reduce((a,d)=>a+d.tasks.length,0);
const dayDone=d=>d.tasks.filter(t=>done.has(t.id)).length;

function countdown(){
  const start=new Date(DAYS[0].date+'T00:00:00'), end=new Date(DAYS[DAYS.length-1].date+'T23:59:59');
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((start-t0)/864e5);
  if(diff>0) return `تبدأ بعد ${daysWord(diff)}`;
  if(now<=end) return `اليوم ${-diff+1} من ${DAYS.length}`;
  return 'انتهت الرحلة';
}

/* strip */
const strip=$('strip');
DAYS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='day'+(d.date===todayISO?' today':'');b.id='day-'+i;b.setAttribute('role','tab');
  b.setAttribute('aria-label',`${d.name} ${Number(d.date.slice(8))} نوفمبر`);
  b.innerHTML=`<span class="dn">${d.short}</span><span class="dd">${Number(d.date.slice(8))}</span><span class="pb"><i></i></span>`;
  b.addEventListener('click',()=>go(i));
  strip.appendChild(b);
});

function updateProgress(){
  const T=total(), D=DAYS.reduce((a,d)=>a+dayDone(d),0), pct=T?Math.round(D/T*100):0;
  const C=2*Math.PI*27, bar=$('ringBar');
  bar.style.strokeDasharray=C; bar.style.strokeDashoffset=C*(1-D/T);
  $('ringPct').textContent=pct+'%';
  $('totalTxt').textContent=`${D} من ${T} مهمة`;
  DAYS.forEach((d,i)=>{
    const b=$('day-'+i), n=dayDone(d);
    b.querySelector('.pb i').style.width=(n/d.tasks.length*100)+'%';
    b.classList.toggle('complete',n===d.tasks.length);
    b.setAttribute('aria-selected',i===sel?'true':'false');
  });
  const d=DAYS[sel];
  $('dayCount').textContent=`${dayDone(d)}/${d.tasks.length}`;
  const next=d.tasks.find(t=>!done.has(t.id));
  document.querySelectorAll('#tl .item').forEach(li=>{
    li.classList.toggle('next',!!next&&li.dataset.id===next.id);
    li.classList.toggle('done',done.has(li.dataset.id));
    const badge=li.querySelector('.badge'); if(badge) badge.hidden=!(next&&li.dataset.id===next.id)&&!badge.classList.contains('late');
    if(badge&&badge.classList.contains('late')) badge.hidden=done.has(li.dataset.id);
  });
}

function itemHTML(t,isToday){
  const c=CATS[t.cat];
  const when=t.time?fmtTime(t.time):'';
  return `<li class="item" data-id="${t.id}"><label class="row" for="c-${t.id}">
    <span class="node"><input class="sr" type="checkbox" id="c-${t.id}" ${done.has(t.id)?'checked':''}><span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
    <span class="card">
      <span class="top">${when?`<span class="time">${when}</span>`:''}
        <span class="cat" style="--c:var(${c.c})"><svg viewBox="0 0 24 24">${ICON[c.i]}</svg>${c.label}</span></span>
      <p class="title">${t.title}</p>
    </span></label></li>`;
}

function renderDay(dir){
  const d=DAYS[sel], tl=$('tl');
  $('dayTitle').textContent=`${d.name}، ${Number(d.date.slice(8))} نوفمبر`;
  $('dayTheme').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${ICON.pin}</svg>${d.theme}`;
  const list=d.tasks.filter(t=>filter==='all'||!done.has(t.id));
  tl.innerHTML=list.length?list.map(t=>itemHTML(t,d.date===todayISO)).join('')
    :`<li class="empty"><b>أُنجزت كل مهام ${d.name}</b>اعرض «كل المهام» لمراجعة ما تم</li>`;
  tl.classList.remove('anim-next','anim-prev'); void tl.offsetWidth;
  if(dir) tl.classList.add(dir>0?'anim-next':'anim-prev');
  $('prevBtn').disabled=sel===0; $('nextBtn').disabled=sel===DAYS.length-1;
  updateProgress();
}

function go(i){
  if(i<0||i>=DAYS.length||i===sel) return;
  const dir=i>sel?1:-1; sel=i; renderDay(dir);
  $('day-'+i).scrollIntoView({block:'nearest',inline:'nearest'});
  const top=$('main').getBoundingClientRect().top+scrollY-90;
  if(scrollY>top) scrollTo({top,behavior:'smooth'});
}

$('tl').addEventListener('change',e=>{
  const li=e.target.closest('.item'); if(!li) return;
  const id=li.dataset.id, d=DAYS[sel], wasComplete=dayDone(d)===d.tasks.length;
  e.target.checked?done.add(id):done.delete(id); save();
  try{navigator.vibrate&&navigator.vibrate(e.target.checked?12:6)}catch(_){}
  updateProgress();
  if(!wasComplete&&dayDone(d)===d.tasks.length){ burst(); toast(`أحسنت، اكتملت مهام ${d.name}`); }
  if(filter==='left'&&e.target.checked){ setTimeout(()=>{li.classList.add('leaving');setTimeout(()=>renderDay(0),300)},450); }
});

function setFilter(f){
  filter=f; $('seg').classList.toggle('left',f==='left');
  $('fAll').setAttribute('aria-pressed',f==='all'); $('fLeft').setAttribute('aria-pressed',f==='left');
  renderDay(0);
}
$('fAll').onclick=()=>setFilter('all'); $('fLeft').onclick=()=>setFilter('left');
$('prevBtn').onclick=()=>go(sel-1); $('nextBtn').onclick=()=>go(sel+1);


/* swipe between days (RTL: swipe right = next day) */
let sx=0,sy=0;
$('main').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('main').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6) go(sel+(dx>0?1:-1));
},{passive:true});

let tt;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

function burst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('fx'),ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=[cs.getPropertyValue('--accent'),cs.getPropertyValue('--gold'),cs.getPropertyValue('--cat-blue'),cs.getPropertyValue('--cat-plum')].map(s=>s.trim());
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();
  (function f(t){
    const k=(t-t0)/1500; ctx.clearRect(0,0,innerWidth,innerHeight);
    if(k>1) return;
    P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.globalAlpha=1-k;ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
    requestAnimationFrame(f);
  })(t0);
}

renderDay(0);
</script>
</body>
